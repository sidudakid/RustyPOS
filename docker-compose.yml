services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: openclaw_cafe
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: change-me-db-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw -d openclaw_cafe"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openclaw:change-me-db-password@db:5432/openclaw_cafe
      HOST: 0.0.0.0
      PORT: 8081
      SEED_ON_STARTUP: "true"
      RUST_LOG: info
    ports:
      - "8081:8081"

volumes:
  postgres_data:
